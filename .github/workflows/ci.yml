name: 교실 한 장 자동 검사

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 필요한 패키지 설치
        run: npm ci

      - name: 코드 작성 규칙 검사
        run: npm run lint

      - name: 빌드와 핵심 화면 검사
        run: npm test
