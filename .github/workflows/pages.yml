name: GitHub Pages 배포

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: 소스 코드 받기
        uses: actions/checkout@v7

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: GitHub Pages 준비
        uses: actions/configure-pages@v6

      - name: 필요한 패키지 설치
        run: npm ci

      - name: 코드 작성 규칙 검사
        run: npm run lint

      - name: 정적 웹사이트 만들기
        run: npm run build:pages

      - name: 배포 파일 올리기
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v5
